<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Siddh Patel | Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/global-styles/reset.css">
  <link rel="stylesheet" href="../assets/global-styles/main.css">
</head>

<body>
<header class="site-header">
  <div class="container">
    <div class="site-title">SIDDH PATEL</div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="skills.html">Skills</a></li>
        <li><a class="active" href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="container">
  <h1 class="section-title">Contact</h1>

  <form class="contact-form">
    <div>
      <label for="name">Name</label>
      <input id="name" type="text" placeholder="Your name">
    </div>

    <div>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com">
    </div>

    <div>
      <label for="message">Message</label>
      <textarea id="message" placeholder="Your message"></textarea>
    </div>

    <button type="button" id="sendBtn">Send</button>
    <div id="status"></div>

<div id="comments"></div>
  </form>

  <p style="margin-top: 1rem;">
    Or email me directly:
    <a href="mailto:siddhpatel3110@gmail.com">siddhpatel3110@gmail.com</a>
  </p>
</main>

<footer class="site-footer">
  <div class="container">
    <p>&copy; 2026 Siddh Patel — Static Portfolio</p>
  </div>
</footer>

<script type="module">

  import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  onValue,
  remove
}

from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA84qg-ooxeTCj06pLE1pJT2L6YcNYKF5U",

  authDomain: "siddh-portfolio-96b33.firebaseapp.com",

  databaseURL:
  "https://siddh-portfolio-96b33-default-rtdb.firebaseio.com",

  projectId: "siddh-portfolio-96b33",

  storageBucket:
  "siddh-portfolio-96b33.firebasestorage.app",

  messagingSenderId:
  "437542448328",

  appId:
  "1:437542448328:web:335781e03f15fa66a7c9fd"

};

const app = initializeApp(firebaseConfig);

 const db = getDatabase(app);

const sendBtn = document.getElementById("sendBtn");

sendBtn.addEventListener("click", () => {

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const message = document.getElementById("message").value;

  push(ref(db, "comments"), {
    name: name,
    email: email,
    message: message,
    createdAt: new Date().toISOString()
  });
  
alert("Comment sent to Firebase!");

document.getElementById("name").value = "";
document.getElementById("email").value = "";
document.getElementById("message").value = "";

});

  const commentsDiv = document.getElementById("comments");

onValue(ref(db, "comments"), (snapshot) => {

  commentsDiv.innerHTML = "";

  snapshot.forEach((childSnapshot) => {

    const data = childSnapshot.val();

    commentsDiv.innerHTML += `

      <div style="
        border:1px solid #ccc;
        padding:10px;
        margin:10px 0;
      ">

        <h4>${data.name}</h4>

        <p>${data.message}</p>

        <button onclick="deleteComment('${childSnapshot.key}')">
    Delete
  </button>
      </div>

    `;
  });
});

window.deleteComment = function(id) {

    remove(ref(db, "comments/" + id));

};

console.log("Firebase Connected");

</script>
</body>
</html>
